name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # A tag is the only thing standing between a commit and releases/latest, and
  # until this job existed nothing checked WHICH commit it pointed at. Both
  # v1.1.0-rc1 and v1.1.0-rc2 were tagged on branch commits that were not on
  # main, and each published a real release -- which was deliberate for a
  # release candidate, and would have been an accident for a full one.
  #
  # So the rule matches how this repo actually works rather than forbidding it:
  # a PRERELEASE may be cut from any commit, because trialling an unmerged
  # branch build is the entire point of one. A FULL release must be an ancestor
  # of main, because it takes over releases/latest and the installers serve it
  # to everyone.
  guard:
    name: Verify the tag is releasable
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The ancestry test needs real history; the default depth-1 checkout
        # has no main to compare against.
        fetch-depth: 0

    - name: Reject a full release that is not on main
      run: |
        set -euo pipefail
        # Semver's own definition: a version carrying a hyphen suffix is a
        # pre-release. Matching on the tag NAME, not the full ref, so nothing
        # in refs/tags/ can accidentally satisfy it.
        if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
          echo "Prerelease tag ${GITHUB_REF_NAME}: any commit may be released."
          exit 0
        fi

        git fetch --no-tags origin main
        if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is on main."
        else
          echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of main." >&2
          echo "A full release takes over releases/latest, so it must be a commit that was merged." >&2
          echo "Merge it first, or cut a prerelease (a tag carrying a '-' suffix) instead." >&2
          exit 1
        fi

  # The suite that gates every PR did not gate the release: create-release
  # needed only build-plugin, so a tag on a commit whose tests fail shipped
  # anyway. The tagged commit is usually one CI already passed, but "usually"
  # is not a check -- and nothing tied the tag to that run.
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Lint with ruff
      run: uv run ruff check src/ tests/

    - name: Run tests
      run: uv run pytest -q

  build-plugin:
    name: Build x64dbg Plugin
    needs: [guard, test]
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Download x64dbg Plugin SDK
      shell: pwsh
      env:
        # Authenticate the release LOOKUP. Unauthenticated api.github.com calls
        # are rate-limited per source IP, and shared CI egress can exhaust that
        # quota -- which would fail a release for a reason having nothing to do
        # with the release. Matches the same call in ci.yml.
        #
        # Only the API call carries the header. The asset download below goes to
        # a redirected CDN URL that is already signed; sending Authorization
        # there is unnecessary and can itself be rejected.
        GH_TOKEN: ${{ github.token }}
      run: |
        $headers = @{
          'Accept'        = 'application/vnd.github+json'
          'Authorization' = "Bearer $env:GH_TOKEN"
          'User-Agent'    = 'binary-mcp-ci'
        }

        Write-Host "Fetching latest x64dbg release info..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/x64dbg/x64dbg/releases/latest" -Headers $headers

        Write-Host "Latest release: $($release.tag_name)"
        $sdkAsset = $release.assets | Where-Object { $_.name -eq "x64dbg-pluginsdk.zip" }

        if (-not $sdkAsset) {
            Write-Error "x64dbg-pluginsdk.zip not found in latest release"
            exit 1
        }

        Write-Host "Downloading official x64dbg plugin SDK ($(($sdkAsset.size / 1KB).ToString('F2')) KB)..."
        Invoke-WebRequest -Uri $sdkAsset.browser_download_url -OutFile sdk.zip

        Write-Host "Creating SDK directory..."
        New-Item -ItemType Directory -Force -Path extern/x64dbg_sdk/pluginsdk

        Write-Host "Extracting SDK..."
        Expand-Archive -Path sdk.zip -DestinationPath extern/x64dbg_sdk/pluginsdk -Force

        Write-Host "SDK ready at: extern/x64dbg_sdk/pluginsdk"
        Write-Host "`nSDK contents:"
        Get-ChildItem extern/x64dbg_sdk/pluginsdk -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

    - name: Build x64 Plugin
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Building 64-bit plugin..."
        $sdkPath = "$env:GITHUB_WORKSPACE/extern/x64dbg_sdk"
        cd src/engines/dynamic/x64dbg/plugin

        New-Item -ItemType Directory -Force -Path build-x64
        cd build-x64

        cmake .. -A x64 `
          -DX64DBG_SDK_PATH="$sdkPath" `
          -DCMAKE_BUILD_TYPE=Release
        if ($LASTEXITCODE -ne 0) { throw "CMake configure failed for x64" }

        cmake --build . --config Release
        if ($LASTEXITCODE -ne 0) { throw "CMake build failed for x64" }

        Write-Host "x64 plugin built successfully"

    - name: Build x32 Plugin
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Building 32-bit plugin..."
        $sdkPath = "$env:GITHUB_WORKSPACE/extern/x64dbg_sdk"
        cd src/engines/dynamic/x64dbg/plugin

        New-Item -ItemType Directory -Force -Path build-x32
        cd build-x32

        cmake .. -A Win32 `
          -DX64DBG_SDK_PATH="$sdkPath" `
          -DCMAKE_BUILD_TYPE=Release
        if ($LASTEXITCODE -ne 0) { throw "CMake configure failed for x32" }

        cmake --build . --config Release
        if ($LASTEXITCODE -ne 0) { throw "CMake build failed for x32" }

        Write-Host "x32 plugin built successfully"

    - name: Prepare Release Artifacts
      shell: pwsh
      run: |
        Write-Host "Preparing release artifacts..."
        New-Item -ItemType Directory -Force -Path release/obsidian-plugins

        # Copy plugin DLLs
        Copy-Item src/engines/dynamic/x64dbg/plugin/build-x64/Release/obsidian.dp64 release/obsidian-plugins/
        Copy-Item src/engines/dynamic/x64dbg/plugin/build-x32/Release/obsidian.dp32 release/obsidian-plugins/

        # Copy HTTP server executable (same for both architectures)
        Copy-Item src/engines/dynamic/x64dbg/plugin/build-x64/Release/obsidian_server.exe release/obsidian-plugins/

        Write-Host "Artifacts prepared in release/obsidian-plugins/"
        Get-ChildItem release/obsidian-plugins/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: obsidian-plugins
        path: release/*

  create-release:
    name: Create GitHub Release
    needs: build-plugin
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Release notes are derived from the commits since the previous tag,
        # which a depth-1 checkout cannot see.
        fetch-depth: 0

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: obsidian-plugins
        path: release/

    - name: Extract Version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Create Release Package
      run: |
        echo "Creating release package structure..."

        # Create package directory with version name
        PACKAGE_NAME="binary-mcp-${{ steps.version.outputs.version }}"
        mkdir -p "$PACKAGE_NAME"

        # Copy source code (excluding unnecessary files)
        rsync -av --progress \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.pytest_cache' \
          --exclude='.venv' \
          --exclude='node_modules' \
          --exclude='.DS_Store' \
          --exclude='*.swp' \
          --exclude='.claude' \
          --exclude='release' \
          --exclude='CODE_OF_CONDUCT.md' \
          --exclude='RELEASING.md' \
          --exclude='SECURITY.md' \
          . "$PACKAGE_NAME/"

        # Copy Obsidian plugins to dedicated directory
        mkdir -p "$PACKAGE_NAME/obsidian-plugins"
        cp release/obsidian-plugins/obsidian.dp64 "$PACKAGE_NAME/obsidian-plugins/"
        cp release/obsidian-plugins/obsidian.dp32 "$PACKAGE_NAME/obsidian-plugins/"
        cp release/obsidian-plugins/obsidian_server.exe "$PACKAGE_NAME/obsidian-plugins/"

        # Create installation instructions for plugins
        cat > "$PACKAGE_NAME/obsidian-plugins/README.md" << 'EOF'
        # Obsidian - x64dbg Plugin Installation

        Obsidian is an AI-powered debugging bridge for x64dbg.

        ## External Process Architecture

        The plugin uses a two-process architecture for stability. You need to install **both** the plugin and the HTTP server.

        ## Installation

        Copy **all three files** to your x64dbg plugins directory:

        **For 64-bit debugger:**
        - `obsidian.dp64` → `x64dbg/x64/plugins/`
        - `obsidian_server.exe` → `x64dbg/x64/plugins/`

        **For 32-bit debugger:**
        - `obsidian.dp32` → `x64dbg/x32/plugins/`
        - `obsidian_server.exe` → `x64dbg/x32/plugins/`

        **IMPORTANT**: The server executable must be in the **same directory** as the plugin DLL!

        ## What Happens

        1. x64dbg loads the Obsidian plugin (`.dp64` or `.dp32`)
        2. Plugin automatically spawns `obsidian_server.exe`
        3. HTTP server runs on port 8765
        4. Communication via Named Pipe IPC

        ## Troubleshooting

        Check x64dbg log for:
        - `[Obsidian] HTTP server process started (PID: ...)`
        - `[Obsidian] HTTP server connected to pipe`

        See [x64dbg-architecture.md](https://github.com/Sarks0/binary-mcp/blob/main/docs/x64dbg-architecture.md) for details.
        EOF

        # Create the release zip
        zip -r "${PACKAGE_NAME}.zip" "$PACKAGE_NAME"

        echo "Release package created: ${PACKAGE_NAME}.zip"
        ls -lh "${PACKAGE_NAME}.zip"

    - name: Generate SHA256SUMS Manifest
      # F-3: obsidian.dp64 / obsidian.dp32 / obsidian_server.exe are loaded by
      # x64dbg into the process that debugs live malware, and install.ps1 copies
      # them into the plugins directory while running as Administrator. The
      # installers already know how to verify a release asset against a
      # SHA256SUMS manifest published with the release - but until this step
      # existed no manifest was ever published, so that machinery was inert and
      # every plugin install was trusted purely because TLS said the bytes came
      # from GitHub. This step is what makes the verification real: the digests
      # are computed here, in the same job that publishes the assets, from the
      # exact bytes that are uploaded.
      #
      # The manifest is written in coreutils format ("<hash>  <name>", bare
      # basenames) because that is what both installers parse, and the asset is
      # named SHA256SUMS because that is the name they look for.
      run: |
        set -euo pipefail
        PACKAGE_NAME="binary-mcp-${{ steps.version.outputs.version }}"

        mkdir -p dist
        cp "${PACKAGE_NAME}.zip" dist/
        cp release/obsidian-plugins/obsidian.dp64 dist/
        cp release/obsidian-plugins/obsidian.dp32 dist/
        cp release/obsidian-plugins/obsidian_server.exe dist/

        cd dist
        {
          echo "# binary-mcp ${{ steps.version.outputs.version }} release checksums (SHA-256)"
          echo "# Verify with: sha256sum -c SHA256SUMS"
          sha256sum obsidian.dp64 obsidian.dp32 obsidian_server.exe "${PACKAGE_NAME}.zip"
        } > SHA256SUMS

        # Fail the release rather than publish a manifest that silently omits an
        # asset: the installers fail closed when a manifest exists but does not
        # cover the asset they are about to install, so a partial manifest would
        # break every install - and a missing entry is exactly the shape a
        # tampered asset would take.
        for f in obsidian.dp64 obsidian.dp32 obsidian_server.exe "${PACKAGE_NAME}.zip"; do
          grep -qE "^[0-9a-f]{64}  ${f}\$" SHA256SUMS || {
            echo "SHA256SUMS is missing an entry for ${f}" >&2
            exit 1
          }
        done

        # Prove the manifest describes the bytes we are about to upload.
        sha256sum -c SHA256SUMS
        cat SHA256SUMS

    # These notes used to be a static heredoc: every release shipped the same
    # body, so nothing told a reader what changed between two versions. It also
    # rotted -- it still advertised "15+ analysis tools" long after the count
    # moved -- and, worst of all, v1.1.0 removed 159 tool names and the notes
    # said nothing at all about it. A user upgrading found out when their calls
    # started failing.
    #
    # What stays hardcoded is only what is TRUE OF EVERY RELEASE: how to verify
    # the assets and how to install them. Anything version-specific is derived
    # from the commits, so it cannot drift from what actually shipped.
    - name: Create Release Notes
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail

        # The previous release to describe changes against. Two rules:
        #
        # Same kind: a FULL release spans from the last full release, not from
        # its own release candidate, or the notes would cover only the
        # rc-to-final delta and omit everything the rc itself introduced.
        #
        # Strictly below: walk down from this tag's own position in version
        # order rather than taking "the highest tag that is not this one" --
        # otherwise a patch tagged on an older line would compare against a
        # NEWER release and describe the range backwards.
        if [[ "${VERSION}" == *-* ]]; then FULL_ONLY=0; else FULL_ONLY=1; fi
        # versionsort.suffix=- makes git order a hyphen-suffixed tag BELOW the
        # release it precedes (1.2.0-rc1 < 1.2.0), which is semver's rule and
        # the opposite of git's default -- by default the longer string sorts
        # higher, so an rc would be treated as newer than its own final.
        PREV=$(git -c versionsort.suffix=- tag --list --sort=-v:refname | awk \
          -v cur="${VERSION}" -v full_only="${FULL_ONLY}" '
            seen && (full_only == 0 || $0 !~ /-/) { print; exit }
            $0 == cur { seen = 1 }
          ')
        echo "Previous tag: ${PREV:-<none>}"

        # Commit subjects and bodies in range, for the breaking-change scan.
        if [[ -n "${PREV}" ]]; then
          RANGE="${PREV}..HEAD"
        else
          RANGE="HEAD"
        fi

        # A breaking change is the one thing a reader MUST not miss, and it is
        # exactly what an auto-generated commit list buries: the squash commit
        # that deleted 159 tool names has a title about consolidation, and the
        # word BREAKING appears only in its body.
        #
        # Read as a conventional-commits footer: a line BEGINNING with
        # "BREAKING CHANGE:" or "BREAKING:", continuing over wrapped lines
        # until a blank line, so a footer that runs to three lines is not
        # clipped to its first. Anchored at the line start deliberately -- the
        # token mid-sentence in running prose is a description of a break, not
        # a declaration of one, and matching it would pull out fragments.
        git log "${RANGE}" --format='%B%n~~COMMIT~~' \
          | awk '
              /^~~COMMIT~~$/ { if (buf != "") { print buf; buf = "" } ; next }
              /^[[:space:]]*$/ { if (buf != "") { print buf; buf = "" } ; next }
              {
                line = $0
                if (buf != "") { sub(/^[[:space:]]+/, "", line); buf = buf " " line; next }
                if (match(line, /^BREAKING( CHANGE)?:[[:space:]]*/)) {
                  buf = "- " substr(line, RSTART + RLENGTH)
                }
              }
              END { if (buf != "") print buf }
            ' \
          | sed -E 's/[[:space:]]+$//' \
          | sort -u > breaking.txt || true

        : > release_notes.md
        if [[ -s breaking.txt ]]; then
          {
            echo "## Breaking changes"
            echo
            cat breaking.txt
            echo
            echo "Read these before upgrading."
            echo
          } >> release_notes.md
        fi

        cat >> release_notes.md << 'NOTES_EOF'
        ## Verifying this release

        `SHA256SUMS` lists the SHA-256 of every asset below. Download it
        alongside the assets and check them before running anything:

        ```bash
        sha256sum -c SHA256SUMS
        ```

        ```powershell
        Get-FileHash .\obsidian.dp64 -Algorithm SHA256   # compare against SHA256SUMS
        ```

        `install.ps1` verifies `obsidian.dp64`, `obsidian.dp32` and
        `obsidian_server.exe` against this manifest automatically, and refuses to
        install a plugin the manifest does not cover.

        ## Installing

        **Option 1: Clone the repository (recommended)**
        ```bash
        git clone https://github.com/Sarks0/binary-mcp.git
        cd binary-mcp
        python3 install.py          # Windows: .\install.ps1  (as Administrator)
        ```

        **Option 2: Download the installer, read it, then run it**
        ```bash
        curl -fsSLO https://raw.githubusercontent.com/Sarks0/binary-mcp/main/install.py
        sha256sum install.py && less install.py
        python3 install.py
        ```

        These installers are deliberately not offered as a
        `download | interpreter` one-liner: that form executes whatever the
        network returned with no copy on disk to inspect, and on Windows it runs
        elevated. See `INSTALL.md` -> Supply-Chain Integrity.

        **Option 3: Manual installation**
        NOTES_EOF

        {
          echo "1. Download and extract \`binary-mcp-${VERSION}.zip\` (verify it against \`SHA256SUMS\` first)"
          echo "2. Follow the instructions in \`INSTALL.md\`"
          echo "3. For the Obsidian x64dbg plugins, see \`obsidian-plugins/README.md\`"
          echo
          echo "The x64dbg plugin binaries in this release report version"
          echo "\`${VERSION#v}\` over \`/api/status\`, so you can confirm which build"
          echo "a debugger has actually loaded."
          echo
          echo "## Requirements"
          echo
          echo "- Python 3.12+"
          echo "- Java 21+ (for Ghidra)"
          echo "- Ghidra (auto-detected, or set GHIDRA_HOME)"
          echo "- x64dbg (optional, for dynamic analysis on Windows)"
          echo
          echo "## Documentation"
          echo
          echo "- [Installation guide](https://github.com/Sarks0/binary-mcp/blob/main/INSTALL.md)"
          echo "- [README](https://github.com/Sarks0/binary-mcp/blob/main/README.md)"
        } >> release_notes.md

        if [[ -n "${PREV}" ]]; then
          echo >> release_notes.md
          echo "**Full diff**: https://github.com/Sarks0/binary-mcp/compare/${PREV}...${VERSION}" >> release_notes.md
        fi

        echo "--- release_notes.md ---"
        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: obsidian-${{ steps.version.outputs.version }}
        body_path: release_notes.md
        # Appends GitHub's own "What's Changed" -- the merged PRs and commits
        # since the previous release -- underneath the body above. This is the
        # part that was missing entirely: the notes are now derived from what
        # shipped rather than restating a fixed feature list that nobody
        # remembers to update.
        generate_release_notes: true
        # F-3: upload from dist/ - the exact directory the SHA256SUMS step
        # hashed - so the published manifest cannot describe a different copy of
        # the assets than the one users download.
        files: |
          dist/SHA256SUMS
          dist/binary-mcp-${{ steps.version.outputs.version }}.zip
          dist/obsidian.dp64
          dist/obsidian.dp32
          dist/obsidian_server.exe
        draft: false
        # Any hyphen suffix means pre-release, per semver -- not just '-rc'.
        # The guard job decides what may be released on the same rule, and the
        # two disagreeing would be worse than either: a 'v1.2.0-beta' tag would
        # clear the guard as a prerelease and then publish as a full release,
        # taking over releases/latest.
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
