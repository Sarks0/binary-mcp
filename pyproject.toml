[project]
name = "binary-mcp"
version = "0.2.0"
description = "MCP server for comprehensive binary analysis - static (Ghidra) and dynamic (x64dbg)"
authors = [
    {name = "Sarks0", email = "Sarks0@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0",
    "fastmcp>=2.13,<3",
    "pefile>=2023.2.7",
    "pyelftools>=0.31",
    "requests>=2.31.0",
    "capstone>=5.0.0",
    "asn1crypto>=1.5.1",
]

[project.optional-dependencies]
# There is deliberately no `yara` extra. Audit finding F-11: this file declared
# `yara = ["yara-python>=4.5.0"]` and the README advertised "rule scanning",
# but `import yara` appears nowhere in src/. src/tools/yara_tools.py only
# GENERATES rule text -- it never compiles or runs a rule -- so the extra
# installed a native-code dependency that nothing could ever import, and the
# README promised a scanning feature that did not exist. Removed rather than
# kept for forward-compat: if scanning is ever added, the extra comes back in
# the same commit as the `import yara` that needs it, which keeps the declared
# dependency surface equal to the real one.
windbg = [
    "pybag>=2.2.16; sys_platform == 'win32'",
]
# Fuzzy-hashing libraries (ssdeep, python-tlsh) wrap native C libraries
# (libfuzzy, libtlsh) and have packaging quirks -- ssdeep's setup.py imports
# pkg_resources, which uv's lockfile resolution cannot satisfy on some
# environments. They are intentionally NOT declared as project extras here;
# users who want fuzzy hashing should install them manually:
#
#   pip install ssdeep python-tlsh    # may need apt install libfuzzy-dev
#
# `compute_similarity_hashes` detects their absence via try/except ImportError
# and emits a footer hint; all other similarity hashes still work without them.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Ghidra scripts run in Jython (Python 2.7), so ignore Python 3 upgrade suggestions
"src/engines/static/ghidra/scripts/*.py" = ["UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
